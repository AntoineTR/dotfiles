unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g base-index 1

#set-option -g default-shell "/bin/zsh"
#set-option -g default-terminal "xterm-256color"
set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc" # true color FTW!
#set-option -a terminal-overrides ",*256col*:RGB"
set-option -g focus-events on
set -g history-limit 100000

#set plugins
set -g @tpm_plugins '                              \
   tmux-plugins/tpm                               \
   dracula/tmux                                   \
   craftzdog/tmux-claude-session-manager          \
'

set -g @dracula-plugins "cpu-usage ram-usage battery network weather time custom:../../../../.local/bin/claude-usage"
set -g @dracula-ram-usage true
set -g @dracula-border-contrast true
set -g @dracula-show-fahrenheit false
set -g @dracula-refresh-rate 10
set -g @dracula-custom-plugin-colors "green dark_gray"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-b send-keys -X page-up
bind -T copy-mode-vi C-f send-keys -X page-down
set -sg escape-time 0
set-option -g repeat-time 250

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

##+ splitting and cycling
unbind %
unbind '"'
bind-key = split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'
bind-key + split-window -hf -c '#{pane_current_path}'
bind-key _ split-window -vf -c '#{pane_current_path}'
bind-key C-n next-window
bind-key C-p previous-window

##+ copy/paste
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer

# reload tmux.conf
bind r source-file ~/.tmux.conf \; display-message " ✱ ~/.tmux.conf is reloaded"

# Init TMUX Plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Override status-left after Dracula loads: show all sessions, current highlighted
set -g status-left "#(~/.local/bin/tmux-sessions) "
set -g status-left-length 100

# Dracula's status-right (cpu/ram/battery/network/weather/time/claude-usage) renders
# wider than tmux's default 100-column cap, which silently truncates the right side
# regardless of actual terminal width. Give it more headroom.
set -g status-right-length 200

# Kill current window
bind-key W kill-window

#Goto next session after kill-session
bind-key X if-shell '[ $(tmux list-sessions | wc -l) -ne 1 ]' \
                    "run-shell 'tmux switch-client -n \\\; kill-session -t \"#S\"'" \
                    "run-shell 'tmux kill-session -t \"#S\"'"

#bind-key C if-shell '[ $(tmux list-sessions | wc -l) -ne 1 ]' \
                    #"run-shell 'tmux new-session -s \#S\ -d'"\
                    #"run-shell 'tmux new-session -s \"#S\" -d'"\
                    #"run-shell 'tmux switch-client -t \"#S\"'"

#Create a new session
bind-key C run-shell 'next_session=$(tmux list-sessions | wc -l) && tmux new-session -s "session_$next_session" -d; tmux switch-client -t session_$next_session'
