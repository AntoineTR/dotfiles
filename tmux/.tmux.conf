unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

set -g base-index 1

#set-option -g default-shell "/bin/zsh"
#set-option -g default-terminal "xterm-256color"
set-option -g default-terminal "screen-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc" # true color FTW!
#set-option -a terminal-overrides ",*256col*:RGB"
set-option -g focus-events on
set -g history-limit 100000

# Claude Code uses the alternate screen buffer by default, which hides its
# output from tmux's copy-mode scrollback. Disable it so prefix+Escape can
# actually scroll back through conversation history.
set-environment -g CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN 1

#set plugins
set -g @tpm_plugins '                              \
   tmux-plugins/tpm                               \
   dracula/tmux                                   \
   craftzdog/tmux-claude-session-manager          \
'

set -g @dracula-plugins "cpu-usage ram-usage battery network weather time custom:../../../../.local/bin/claude-usage"
set -g @dracula-ram-usage true
set -g @dracula-border-contrast true
set -g @dracula-show-fahrenheit false
set -g @dracula-refresh-rate 10
set -g @dracula-custom-plugin-colors "green dark_gray"

# Recolor Dracula to match kitty's Espresso theme (kitty/kitty.conf)
set -g @dracula-colors "
white='#ffffff'
gray='#535353'
dark_gray='#323232'
light_purple='#efb5f7'
dark_purple='#6c99ba'
cyan='#bdd6ff'
green='#a4c161'
orange='#ffc56d'
red='#d25252'
pink='#d096d9'
yellow='#e1e48a'
"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
# No local X server on this box (mosh/ssh-only), so xclip can never reach a
# clipboard - the copy has to travel to the client machine as OSC 52.
#
# set-clipboard on is kept so OSC 52 emitted by apps inside panes still gets
# picked up, but it is NOT what carries a copy-mode yank to the Mac: tmux emits
# OSC 52 with an empty selection (ESC ] 52 ; ; <b64>) and mosh only accepts the
# `c` selection, so mosh drops every tmux-generated copy. tmux cannot be
# configured around it - its Ms string must consume both %p1 and %p2, and tmux
# always passes an empty %p1, so hardcoding `;c;` makes tmux emit nothing.
# osc52-copy writes the correctly-formed sequence to the outer client's tty
# itself. See bin/osc52-copy.
set -g set-clipboard on
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel '~/.local/bin/osc52-copy'
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel '~/.local/bin/osc52-copy'
bind -T copy-mode-vi Y send-keys -X copy-pipe-end-of-line-and-cancel '~/.local/bin/osc52-copy'
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi C-b send-keys -X page-up
bind -T copy-mode-vi C-f send-keys -X page-down
set -sg escape-time 0
set-option -g repeat-time 250

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5

##+ splitting and cycling
unbind %
unbind '"'
bind-key = split-window -h -c '#{pane_current_path}'
bind-key - split-window -v -c '#{pane_current_path}'
bind-key + split-window -hf -c '#{pane_current_path}'
bind-key _ split-window -vf -c '#{pane_current_path}'
bind-key C-n next-window
bind-key C-p previous-window

##+ copy/paste
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer

# reload tmux.conf
bind r source-file ~/.tmux.conf \; display-message " ✱ ~/.tmux.conf is reloaded"

# Init TMUX Plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Make prefix+y a real popup toggle. The claude-session-manager plugin binds
# prefix+y to launch-only (inside the popup it just says "Popup window already
# open"); bin/claude-popup-toggle adds the closing half by detaching instead.
# tpm loads plugins only after this whole file is parsed, so a plain bind-key
# here would be overridden by the plugin's - queue the rebind as a run-shell,
# which executes in order after tpm's. ## keeps the formats literal in the
# stored binding so they expand at keypress, not while this line runs.
run-shell "tmux bind-key y run-shell \"~/.local/bin/claude-popup-toggle '##{q:pane_current_path}' '##{q:window_id}'\""

# Override status-left after Dracula loads: show all sessions, current highlighted
set -g status-left "#(~/.local/bin/tmux-sessions) "
set -g status-left-length 100

# Dracula's status-right (cpu/ram/battery/network/weather/time/claude-usage) renders
# wider than tmux's default 100-column cap, which silently truncates the right side
# regardless of actual terminal width. Give it more headroom.
set -g status-right-length 200

# Kill current window
bind-key W kill-window

#Goto next session after kill-session
bind-key X if-shell '[ $(tmux list-sessions | wc -l) -ne 1 ]' \
                    "run-shell 'tmux switch-client -n \\\; kill-session -t \"#S\"'" \
                    "run-shell 'tmux kill-session -t \"#S\"'"

#bind-key C if-shell '[ $(tmux list-sessions | wc -l) -ne 1 ]' \
                    #"run-shell 'tmux new-session -s \#S\ -d'"\
                    #"run-shell 'tmux new-session -s \"#S\" -d'"\
                    #"run-shell 'tmux switch-client -t \"#S\"'"

#Create a new session
bind-key C run-shell 'next_session=$(tmux list-sessions | wc -l) && tmux new-session -s "session_$next_session" -d; tmux switch-client -t session_$next_session'
