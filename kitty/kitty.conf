# Shell (attach to tmux, matching alacritty/alacritty.yml; falls back to a
# plain login shell if tmux isn't installed, instead of exiting instantly)
shell /bin/bash -l -c "tmux attach || tmux || exec bash -l"

# Window
background_opacity 0.8
copy_on_select yes

# Colors (Espresso, ported from macOS Terminal.app)
background #323232
foreground #ffffff

cursor           #d6d6d6
selection_background #5b5b5b
selection_foreground #323232

# black
color0  #353535
color8  #535353
# red
color1  #d25252
color9  #f00c0c
# green
color2  #a4c161
color10 #c1df74
# yellow
color3  #ffc56d
color11 #e1e48a
# blue
color4  #6c99ba
color12 #8ab6d9
# magenta
color5  #d096d9
color13 #efb5f7
# cyan
color6  #bdd6ff
color14 #dbf4ff
# white
color7  #ededec
color15 #ffffff
